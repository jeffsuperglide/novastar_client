# Continuous Acquisition Configurations
[client]
timeout = 60

[logger]
level = "DEBUG"
format = "%(asctime)s %(name)s %(levelname)s : %(message)s"
file = "ztest_con_acq.log"
max_bytes = 100_000_000
backup_count = 2

[dss]
file = "novastar.dss"

[period]
start = "now_minus_1Day"
end = "now"

[timeseries_parameters]  # NovaStar API parameters for time series (ts)
includeMissing = true # estimate missings more for stage/elevation and NOT for precipitation.
includeEstimates = false # include missings will return a None for TimeSeriesPoint values.  Use Panda df.fillna() to replace those 'None' values.
# timezone = "UTC"

[fill]  # Panda DataFrame fill options; works with includeMissing
order = ["ffill", "interpolate", "fillna"]

[fill.ffill]
enabled = false
axis = 0                  # 0 = down columns, 1 = across rows
# limit = 5                 # max consecutive NaNs to fill; omit/None = no limit
# limit_area = "inside"     # "inside" | "outside" | omit/None

[fill.interpolate]
enabled = false
method = "linear"             # linear, time, index, nearest, polynomial, spline, pchip, akima...
# order = 2                     # required for "polynomial" / "spline" methods
# axis = 0                      # 0 interpolates column-by-column, 1 row-by-row.
# limit = 10                    # maximum number of consecutive NaNs to fill.
# limit_direction = "forward"   # "forward" | "backward" | "both"
# limit_area = "inside"         # "inside" | "outside" | omit/None

[fill.fillna]
enabled = true
value = 0         # a scalar
# axis = 0            # 0 or 1, the axis along which to fill.
# limit = 3           # max number of NaNs to fill.


